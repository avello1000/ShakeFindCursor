name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: "Build main app (build.bat: rc + cl)"
        shell: cmd
        run: build.bat

      - name: Build test tools
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /utf-8 /DUNICODE /D_UNICODE e2e-test.cpp /link user32.lib gdi32.lib shell32.lib /SUBSYSTEM:CONSOLE /OUT:e2e-test.exe
          cl /nologo /EHsc /O2 /utf-8 /DUNICODE /D_UNICODE marquee-test.cpp /link user32.lib gdi32.lib gdiplus.lib /SUBSYSTEM:CONSOLE /OUT:marquee-test.exe

      - name: Smoke test (app starts and stays alive)
        shell: pwsh
        run: |
          Start-Process -FilePath .\ShakeFindCursor.exe
          Start-Sleep -Seconds 3
          $p = Get-Process -Name ShakeFindCursor -ErrorAction SilentlyContinue
          if (-not $p) { Write-Output "::error::App process is not alive after 3 seconds"; exit 1 }
          Write-Output "App alive, PID(s): $($p.Id -join ', ')"
          Stop-Process -Name ShakeFindCursor -Force
          Write-Output "Smoke test passed"

      - name: Upload main app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShakeFindCursor-win-x64
          path: ShakeFindCursor.exe
          if-no-files-found: error
